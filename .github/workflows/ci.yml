name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: markmine-dist
          path: dist
